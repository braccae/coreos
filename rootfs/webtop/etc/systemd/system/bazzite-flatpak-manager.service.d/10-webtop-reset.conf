# /etc survives a /var volume reset but the flatpak installation does not, so
# the manager's version stamp would make it skip. Re-run it when the system
# flatpak app directory is empty.
[Service]
ExecStartPre=-/bin/sh -c 'find /var/lib/flatpak/app -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null | grep -q . || rm -f /etc/bazzite/flatpak_manager_version /etc/bazzite/flatpak_manager_image_name'
