# Front door for the Webtop container.
#
# Selkies 2.1 serves its own dashboard and the websocket endpoint from the same
# aiohttp process (/ for the dashboard, /api/ws for the stream). nginx is a thin
# reverse proxy so the container keeps a single published port and can add
# headers/timeouts in one place; it does not serve static files of its own.
server {
  listen 3000 default_server;
  listen [::]:3000 default_server;

  location / {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    100M;
    proxy_pass              http://127.0.0.1:8082;
  }
}
