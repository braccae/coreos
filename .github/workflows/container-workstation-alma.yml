name: Workstation Alma Container

on:
  workflow_run:
    workflows: ["Alma Container"]
    types:
      - completed
    branches:
      - main
  push:
    branches: ["main"]
    paths:
      - "workstation-alma.Containerfile"
      - "rootfs/workstation-alma/**"
      - "build/justfile"
      - ".github/workflows/container-workstation-alma.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 1/2 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: workstation-alma
      variant_tag: workstation-alma
      containerfile: workstation-alma.Containerfile
      image_desc: "alma kde plasma workstation"
      keywords: "bootc,alma,workstation"
      architectures: '["amd64"]'
      is_bootc: true
      rechunk: true
      free_disk_space: true
      use_btrfs_storage: true
    secrets: inherit
