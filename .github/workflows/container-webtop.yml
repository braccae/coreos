name: Webtop Container

on:
  push:
    branches: ["main"]
    paths:
      - "webtop.Containerfile"
      - "rootfs/webtop/**"
      - "rootfs/common/**"
      - "build/plasma-nm/**"
      - "build/justfile"
      - ".github/workflows/container-webtop.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 1/2 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: webtop
      variant_tag: webtop
      containerfile: webtop.Containerfile
      image_desc: "fedora kde webtop"
      keywords: "webtop,fedora,kde"
      architectures: '["amd64"]'
      is_bootc: false
      rechunk: false
      free_disk_space: true
      use_btrfs_storage: true
    secrets: inherit
