name: HCI Container

on:
  workflow_run:
    workflows: ["Alma Container"]
    types:
      - completed
    branches:
      - main
  push:
    branches: ["main"]
    paths:
      - "hci.Containerfile"
      - "rootfs/hci/**"
      - "build/justfile"
      - ".github/workflows/container-hci.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: alma
      variant_tag: hci
      containerfile: hci.Containerfile
      image_desc: "alma hci bootc"
      keywords: "bootc,alma,hci"
      architectures: '["amd64","arm64"]'
      is_bootc: true
      rechunk: true
      extra_args: |
        --cap-add=CAP_MAC_ADMIN
        --security-opt label=disable
        --isolation=chroot
    secrets: inherit