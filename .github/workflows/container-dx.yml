name: DX Container

on:
  workflow_run:
    workflows: ["Alma Container"]
    types:
      - completed
    branches:
      - main
  push:
    branches: ["main"]
    paths:
      - "dx.Containerfile"
      - "rootfs/dx/**"
      - "build/selinux/nix/**"
      - "build/justfile"
      - ".github/workflows/container-dx.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: alma
      variant_tag: dx
      containerfile: dx.Containerfile
      image_desc: "alma dx bootc"
      keywords: "bootc,alma,dx"
      architectures: '["amd64","arm64"]'
      is_bootc: true
      rechunk: true
    secrets: inherit