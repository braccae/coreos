name: Workstation Container

on:
  push:
    branches: ["main"]
    paths:
      - "workstation.Containerfile"
      - "rootfs/workstation/**"
      - "rootfs/btrfs_config/**"
      - "repos/**"
      - "build/justfile"
      - ".github/workflows/container-workstation.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 1/2 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: workstation
      variant_tag: latest
      containerfile: workstation.Containerfile
      image_desc: "bazzite bootc workstation"
      keywords: "bootc,bazzite,workstation"
      architectures: '["amd64"]'
      is_bootc: true
      rechunk: true
      free_disk_space: true
      use_btrfs_storage: false
      disable_fuse_overlayfs: true
      extra_args: "--build-arg KMODS_IMAGE=ghcr.io/${{ github.repository_owner }}/kmods:latest"
    secrets: inherit