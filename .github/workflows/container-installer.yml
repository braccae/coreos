name: Installer Container

on:
  push:
    branches: ["main"]
    paths:
      - "installer.Containerfile"
      - "build/justfile"
      - ".github/workflows/container-installer.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 1/4 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: coreos
      variant_tag: installer
      containerfile: installer.Containerfile
      image_desc: "coreos bootc installer"
      keywords: "bootc,installer"
      architectures: '["amd64"]'
      is_bootc: true
      rechunk: false
      free_disk_space: true
      use_btrfs_storage: true
    secrets: inherit