name: Alma Container

on:
  push:
    branches: ["main"]
    paths:
      - "Containerfile"
      - "rootfs/common/**"
      - "rootfs/non_btrfs/**"
      - "build/justfile"
      - "build/selinux/sshd/**"
      - "repos/**"
      - ".github/workflows/container.yml"
      - ".github/workflows/_reusable-container-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 1/4 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      mismatch: ${{ steps.check.outputs.mismatch }}
    steps:
      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Kernel Mismatch
        id: check
        run: |
          # Pull base image and extract kernel version
          podman pull quay.io/almalinuxorg/almalinux-bootc:10
          BASE_KERNEL=$(podman run --rm quay.io/almalinuxorg/almalinux-bootc:10 sh -c 'basename /lib/modules/* | head -1')
          echo "Base image kernel: $BASE_KERNEL"

          # Pull kmods image and extract Alma amd64 kernel version
          KMODS_IMAGE="ghcr.io/${{ github.repository_owner }}/kmods:latest"
          podman pull $KMODS_IMAGE || true

          # Use podman create/cp since it is a scratch image
          CONTAINER_ID=$(podman create $KMODS_IMAGE true)
          if [ -n "$CONTAINER_ID" ]; then
            podman cp "$CONTAINER_ID:/zfs/alma/amd64/kernel-version.txt" ./kmod-version.txt 2>/dev/null || echo "none" > ./kmod-version.txt
            KMOD_KERNEL=$(cat ./kmod-version.txt)
            podman rm "$CONTAINER_ID"
          else
            KMOD_KERNEL="none"
          fi
          echo "Kmods image kernel: $KMOD_KERNEL"

          if [ "$BASE_KERNEL" != "$KMOD_KERNEL" ]; then
            echo "mismatch=true" >> $GITHUB_OUTPUT
            echo "::warning ::Kernel mismatch detected (Base: $BASE_KERNEL, Kmods: $KMOD_KERNEL). Triggering kmods build..."
            gh workflow run container-kmods.yml -R ${{ github.repository }} --ref ${{ github.ref_name }}
          else
            echo "mismatch=false" >> $GITHUB_OUTPUT
            echo "Kernel versions match ($BASE_KERNEL)."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: kernel-check
    if: always() && needs.kernel-check.result == 'success' && needs.kernel-check.outputs.mismatch == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_reusable-container-build.yml
    with:
      image_name: alma
      variant_tag: latest
      containerfile: Containerfile
      image_desc: "alma bootc"
      keywords: "bootc,alma"
      architectures: '["amd64","arm64"]'
      is_bootc: true
      rechunk: true
      extra_args: "--build-arg KMODS_IMAGE=ghcr.io/${{ github.repository_owner }}/kmods:latest"
    secrets: inherit

  trigger-databases:
    needs: build-and-push
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger PostgreSQL Container Build
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DB_REPO_TRIGGER_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/braccae/databases/dispatches \
            -d '{"event_type": "alma-container-built"}'
